# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: graffity_pos_db
    restart: always
    environment:
      POSTGRES_DB: graffity_pos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1475
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: graffity_pos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graffity_pos_api
    restart: always
    # Cambiar el comando para usar el servidor ASGI de desarrollo
    command: python manage.py runserver 0.0.0.0:8000  # ← Este comando SÍ funciona con ASGI
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data: